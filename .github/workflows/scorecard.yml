# OSSF Scorecard - the supply-chain posture of this repository, scored on every
# push to main and weekly.
#
# The results go to two different places, and they are not alternatives:
#
#   - GitHub code scanning (the SARIF upload below). The findings land on the
#     repository's Security tab, and this is the only one of the two that moves
#     the scorecard's own SAST check.
#   - The OpenSSF public API (`publish_results`). This is the badge
#     (https://api.securityscorecards.dev/projects/github.com/sasjs/adapter/badge)
#     and a signed attestation for the run. Publishing makes the public score
#     follow this repository's pushes rather than the OpenSSF's own schedule.
#
# Each needs its own permission in the job below. Remove a step and its permission
# together, or the scorecard's Token-Permissions check deducts for the excess.
name: Scorecard supply-chain security

on:
  # the protection rules are themselves scored, so a change to them is a trigger
  branch_protection_rule:
  schedule:
    # weekly: some checks (branch protection, code review) only change with the
    # repository's settings, not with a push
    - cron: '30 1 * * 6'
  push:
    branches: [master]

# read-only by default; the job adds exactly what it needs
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # a hung analysis otherwise holds a runner until the default limit
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # publish_results - the OIDC token is what gets signed
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the analysis reads the repository, it never pushes to it
          persist-credentials: false

      - name: Run analysis
        # Pinned by commit SHA rather than by tag on purpose: an unpinned action in
        # a supply-chain check is what the Pinned-Dependencies check deducts for.
        # The SHA must be the one the tag resolves TO, not an annotated tag's own
        # id - .github/workflows/action-pins.yml catches the difference.
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the SARIF with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
