# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs Build and Server Tests

on:
  # Manual only. This job needs the 4GL VPN and a live SAS server, and it has
  # never completed unattended: the last attempt sat on the VPN step for six
  # hours until GitHub cancelled it, which also left every PR with a red check
  # that says nothing. Trigger it from the Actions UI when a server-side check
  # is actually wanted.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    # A stall here used to run to GitHub's six-hour default.
    timeout-minutes: 20

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

      # 2. Restore npm cache manually
      - name: Restore npm cache
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: |
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Cypress binary
        uses: actions/cache@v3
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            cypress-${{ runner.os }}-

      - name: Install Dependencies
        run: npm ci

      - name: Install Cypress binary
        run: npx cypress install

      - name: Install Rimraf
        run: npm i rimraf

      - name: Build Package
        run: npm run package:lib
        env:
          CI: true

      - name: Write VPN Files
        run: |
          echo "$CA_CRT" > .github/vpn/ca.crt
          echo "$USER_CRT" > .github/vpn/user.crt
          echo "$USER_KEY" > .github/vpn/user.key
          echo "$TLS_KEY" > .github/vpn/tls.key
        shell: bash
        env:
          CA_CRT: ${{ secrets.CA_CRT}}
          USER_CRT: ${{ secrets.USER_CRT }}
          USER_KEY: ${{ secrets.USER_KEY }}
          TLS_KEY: ${{ secrets.TLS_KEY }}

      - name: Chmod VPN files
        run: |
          chmod 600 .github/vpn/ca.crt .github/vpn/user.crt .github/vpn/user.key .github/vpn/tls.key

      - name: Check the VPN files are not empty
        # A secret that was never set still writes a file, so "Write VPN Files"
        # succeeds and the problem only shows up as a tunnel that never comes
        # up. Fail here, where the cause is obvious.
        run: |
          failed=0
          for f in ca.crt user.crt user.key tls.key; do
            size=$(stat -c%s ".github/vpn/$f")
            echo ".github/vpn/$f: $size bytes"
            if [ "$size" -eq 0 ]; then
              echo "::error::.github/vpn/$f is empty - its secret is not set"
              failed=1
            fi
          done
          exit $failed
        shell: bash

      - name: Install Open VPN
        run: |
          sudo apt install apt-transport-https
          sudo wget https://swupdate.openvpn.net/repos/openvpn-repo-pkg-key.pub
          sudo apt-key add openvpn-repo-pkg-key.pub
          sudo wget -O /etc/apt/sources.list.d/openvpn3.list https://swupdate.openvpn.net/community/openvpn3/repos/openvpn3-jammy.list
          sudo apt update
          sudo apt install openvpn3=17~betaUb22042+jammy

      - name: Start Open VPN 3
        # --background so the step returns. Without it session-start stays in
        # the foreground streaming the session log, which is why this step hung
        # and the diagnostics below - the ones that would say what went wrong -
        # never ran.
        run: openvpn3 session-start --background --config .github/vpn/config.ovpn

      - name: Wait for the tunnel
        # Bounded and loud, so a failure here reads as a failure rather than a
        # hang. Prints the session state on every attempt.
        run: |
          for i in $(seq 1 12); do
            if ip addr show tun0 > /dev/null 2>&1; then
              echo "tun0 is up after $((i * 5))s"
              ip addr show tun0
              exit 0
            fi
            echo "--- attempt $i of 12: no tun0 yet ---"
            openvpn3 sessions-list || true
            sleep 5
          done
          echo "::error::tun0 did not come up within 60s"
          echo "--- sessions-list ---"
          openvpn3 sessions-list || true
          echo "--- session log ---"
          path=$(openvpn3 sessions-list | awk '/Path:/{print $2; exit}')
          [ -n "$path" ] && openvpn3 log --session-path "$path" --log-level 4 | tail -40 || true
          exit 1
        shell: bash

      - name: install pm2
        run: npm i -g pm2

      - name: Diagnose VPN connectivity
        run: |
          echo "--- openvpn3 sessions-list ---"
          openvpn3 sessions-list
          echo "--- openvpn3 session-stats ---"
          openvpn3 session-stats --config .github/vpn/config.ovpn
          echo "--- ip addr (tun interface) ---"
          ip addr show tun0 || echo "no tun0 interface found"
          echo "--- ip route ---"
          ip route
          echo "--- DNS resolution check for target host (host/IP not printed) ---"
          TARGET_HOST="$(echo '${{ secrets.SASJS_SERVER_URL }}' | sed -E 's#^[a-z]+://##; s#[:/].*##')"
          if getent hosts "$TARGET_HOST" > /dev/null; then
            echo "DNS resolution: OK"
          else
            echo "DNS resolution: FAILED"
          fi
        shell: bash

      - name: Fetch SASJS server
        run: |
          curl -sS --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 15 --max-time 30 \
            -o /dev/null -w "HTTP status: %{http_code}\n" \
            "${{ secrets.SASJS_SERVER_URL }}/SASjsApi/info"

      - name: Deploy sasjs-tests
        run: |
          sudo apt install jq
          cd sasjs-tests
          npm i --ignore-scripts
          npm i ../build/sasjs-adapter-5.0.0.tgz
          jq '.sasJsConfig.serverUrl |= "${{ secrets.SASJS_SERVER_URL }}"' ./public/config.json > ./public/config.temp && mv ./public/config.temp ./public/config.json
          jq '.sasJsConfig.serverType |= "SASJS"' ./public/config.json > ./public/config.temp && mv ./public/config.temp ./public/config.json
          jq '.sasJsConfig.loginMechanism |= "Default"' ./public/config.json > ./public/config.temp && mv ./public/config.temp ./public/config.json
          jq '.userName |= "${{ secrets.SASJS_USERNAME }}"' ./public/config.json > ./public/config.temp && mv ./public/config.temp ./public/config.json
          jq '.password |= "${{ secrets.SASJS_PASSWORD }}"' ./public/config.json > ./public/config.temp && mv ./public/config.temp ./public/config.json

          cat ./public/config.json

          npm run update:adapter
          pm2 start --name sasjs-test npm -- start

      - name: Sleep for 10 seconds
        run: sleep 10s
        shell: bash

      - name: Run cypress on sasjs
        env:
          TERM: dumb
        run: |
          sed -i "s|sasjsTestsUrl: '.*'|sasjsTestsUrl: 'http://localhost:3000'|g" ./cypress.config.js
          sed -i "s|username: '.*'|username: '${{ secrets.SASJS_USERNAME }}'|g" ./cypress.config.js
          sed -i "s|password: '.*'|password: '${{ secrets.SASJS_PASSWORD }}'|g" ./cypress.config.js
          cat ./cypress.config.js
          echo "SASJS_USERNAME=${{ secrets.SASJS_USERNAME }}"

          sh ./sasjs-tests/sasjs-cypress-run.sh ${{ secrets.MATRIX_TOKEN }} https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}
