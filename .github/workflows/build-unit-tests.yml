# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: SASjs Build and Unit Test

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }}

        # 2. Restore npm cache manually
      - name: Restore npm cache
        uses: actions/cache@v3
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Check npm audit
        # Prod-scoped on purpose: this gate covers what actually ships. The dev
        # tree carries advisories from jest's own tree and the webpack
        # toolchain, none of which has a patched release yet, so gating on them
        # would mean a permanently red build.
        run: npm audit --omit=dev --audit-level=low

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs.
        run: node release/audit.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Install the release toolchain
        # So the pack-check below packs the same tree the publish job does. The
        # toolchain is not a dependency of this package - see release/audit.mjs.
        run: npm ci --prefix release --ignore-scripts

      - name: Check what the package would carry
        # Guards the tarball-leak shape: a broad allowlist glob ("**/*.d.ts")
        # also matched the release toolchain's node_modules, which shipped 1330
        # files and 24 MB. Fails on any node_modules/ or release/ path. The
        # install above is what makes that visible - without it this packed 3
        # files and passed while the leak was present.
        run: node release/pack-check.mjs

      - name: Install Rimraf
        run: npm i rimraf

      - name: Check code style
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Package
        run: npm run package:lib
        env:
          CI: true

      # For some reason if coverage report action is run before other commands, those commands can't access the directories and files on which they depend on
      - name: Generate coverage report
        if: matrix.node-version == 22
        uses: artiomtr/jest-coverage-report-action@v2.0-rc.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
