name: Generate docs and Push to docs Branch

on:
  push:
    branches:
      - master

# read-only by default; the job that publishes to the docs branch asks for the
# write it needs
permissions: read-all

jobs:
  generate_and_push_docs:
    runs-on: ubuntu-latest
    permissions:
      # it force-pushes the generated docs to the gh-pages branch
      contents: write

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version:
            ${{ matrix.node-version }}

            # 2. Restore npm cache manually
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Ensure docs folder exists
        run: |
          rm -rf docs || true # avoid error if docs folder does not exist
          mkdir docs

      - name: Generate Docs
        run: npm run typedoc

      - name: Push generated docs
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs
          cname: adapter.sasjs.io
