# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: SASjs Build and Publish

on:
  push:
    branches:
      - master
  # A release should not depend on the push trigger firing, and a run that
  # strands a release should be recoverable without a new commit. This makes
  # the release reachable from the Actions UI or the API. Same reason as
  # sasjs/utils publish.yml, which gained it after the merge of #277 produced
  # no workflow run at all.
  workflow_dispatch:

# One release at a time. Both triggers publish: the push trigger fires on every
# release commit @semantic-release/git pushes back to master, and the dispatch
# trigger exists precisely so a stranded release can be recovered by hand. With
# no gate the two can overlap, and two semantic-release processes racing the
# same tag and the same npm stage is a new way to strand a release - the failure
# class the retry above repairs. `cancel-in-progress: false` queues the second
# run rather than cancelling the first, because cancelling a run midway through
# a release is itself a way to leave a tag pushed and the release missing.
concurrency:
  group: npmpublish
  cancel-in-progress: false

# read-only by default; the release job asks for the writes it needs, and a job block replaces this one rather than adding to it
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write       # required for npm provenance (trusted publisher)
      issues: write         # optional: lets @semantic-release/github comment on issues
      pull-requests: write  # optional: lets @semantic-release/github comment on PRs

    strategy:
      matrix:
        node-version: [22]

    steps:
      # Mint a short-lived GitHub App token (bypass-capable)
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # The app token is what creates the GitHub release (and therefore the tag) as an
      # app rather than as github-actions; nothing is pushed to master from here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0      # semantic-release needs full history + tags

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1.
      # Pinned to the version the publish path was reviewed with rather than
      # @latest, which would adopt a new npm major into the release path without
      # a commit here.
      # The script fetches that release's tarball and verifies a recorded
      # sha512, rather than installing it: `npm install -g` re-resolves the
      # version against the registry on every run and cannot be attested to, so
      # it is unpinnable by construction.
      # Keep this at the same version as the step in build-unit-tests.yml - that
      # pairing is what makes a pull request read the pack report with the npm
      # the release job uses. Bump the version in .github/scripts/pinned-npm.sh
      # and both jobs follow.
      - name: Pin the npm the release path uses
        run: bash .github/scripts/pinned-npm.sh

        # Restore npm cache manually
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Clean up ready for publishing
        run: npm run publishInit

      - name: Check the browser bundle
        # What ships, so it runs after publishInit put dist/ at the package root.
        # The bundle must stay free of the Node polyfill tree - webpack aliasing
        # `crypto` and `constants` to crypto-browserify pulled ~555 KB of
        # AES/RSA/ECDSA polyfills and the vm shim's dynamic code execution into
        # it - and browser-reachable source must not import the utils barrel,
        # which is the other way the crypto chain reaches the bundle
        # (sasjs/utils#275).
        run: node release/bundle-check.mjs

      - name: Audit the release toolchain
        # Its own scope: the toolchain is not shipped, so it must not gate the
        # package, but it runs with publish credentials, so it must not be
        # invisible either. Fails on anything outside the named exemptions in
        # release/audit.mjs.
        run: node release/audit.mjs

      - name: Install the release tooling
        # Its own locked tree, installed here rather than carried as a
        # devDependency: that tree is where the unfixable advisories live
        # (micromatch -> braces, and the npm package @semantic-release/npm
        # bundles), so keeping it out of the package's dependencies keeps it
        # out of `npm audit`. Locked, unlike resolving from npx, so the
        # resolved versions and their integrity hashes are pinned.
        run: npm ci --prefix release --ignore-scripts

      - name: Check what the package would carry
        # After the install, not before. The leak this guards against is the
        # toolchain's own node_modules being matched by a broad allowlist glob
        # ("**/*.d.ts"), so the check has to see that tree - run before the
        # install it packed 3 files and passed while the leak was present.
        run: node release/pack-check.mjs

      - name: Check the packed package loads
        # The other direction of the same allowlist: it names the root modules one
        # by one, so a module added to src/ and required by another is silently
        # left out. 6.0.0 shipped auth/refreshTokensForSasjs.js requiring
        # ../apiBasePath, which the allowlist did not name - every Node consumer
        # failed at require, while the suite (which loads src/) was green. This
        # packs, unpacks and requires the entry point, which is the only check
        # that sees what a consumer gets.
        run: node release/pack-load-check.mjs

      - name: Check @sasjs dependencies are ranges
        # The PR workflow gates this too, but this is the path that publishes: a
        # change that reaches the release branch without a PR would otherwise
        # ship a pin that nests a second copy in every consumer.
        run: node release/dep-range-check.mjs

      - name: Semantic Release
        # semantic-release creates the GitHub release, and the tag with it, through the
        # API - so the only thing this step needs is a token that can create releases.
        # It no longer pushes anything to master: @semantic-release/git used to commit
        # the version bump to the branch, which is the sole reason this workflow needed
        # an App with a branch-protection bypass - and a bypass granted to an App is a
        # bypass for anyone holding a token for that App. With the branch push gone,
        # master stays PR-only for every identity, and the released version lives in the
        # tag and on the registry.
        #
        # The retry this step used to carry existed for the tag push that followed the
        # branch push ("missing necessary objects" on 2026-10-17). There is no local tag
        # and no branch push to sequence any more, so a failure here is a real failure.
        run: release/node_modules/.bin/semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}   # <-- app token, not secrets.GITHUB_TOKEN

      # semantic-release only releases when it finds a releasable commit, and the
      # angular convention it is configured with does not treat `build:` or
      # `chore:` as one. This step ran on `if: success()` regardless, so a merge
      # with no releasable commit published the version already in package.json,
      # which npm rejects with "You cannot publish over the previously published
      # versions". Compare against the registry instead, and stage only when
      # there is something new.
      #
      # `npm stage publish`, not `npm publish`: the package declares dual-use
      # content (`contentPolicy` in package.json, DISCLOSURE at the root of the
      # tarball). npm's dual-use policy does not permit direct publishing
      # through trusted publishing - staging with a maintainer's 2FA promotion
      # is the permitted automated path. The staged version is not installable
      # until it is approved, so the version guard compares against the live
      # registry version.
      #
      # `npm stage publish` is always an allowed action for a trusted publisher,
      # independent of `npm publish` and `npm dist-tag`. This package's trust
      # relationship already stages: 5.0.2 was staged through this same OIDC
      # path on 2026-10-14. A trust entry predating the allowed-actions setting
      # would need stage publish enabled in the package's Trusted Publisher
      # settings before this step can authenticate.
      - name: Stage the release on npm
        id: publish
        if: success()
        run: |
          # `prepareCmd` writes the version into the workspace only when
          # semantic-release decides to cut one, so the placeholder surviving this step
          # IS the "nothing to release" signal. Comparing against the registry cannot
          # work once the committed file carries a placeholder: the two would never
          # match, and every merge would try to stage the placeholder itself.
          local_version=$(node -p "require('./package.json').version")

          if [ "$local_version" = "0.0.0-semantically-released" ]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to stage - semantic-release cut no version in this run"
            exit 0
          fi

          # A staged version shares the semver index with published versions but
          # is invisible to `npm view`, so a re-run while an approval is pending
          # (a later step failing after a successful stage, say) passes the guard
          # and meets an already-staged error. That is the state this step wants,
          # so report it as staged rather than failing the build.
          if ! stage_output=$(npm stage publish 2>&1); then
            printf '%s\n' "$stage_output"
            if printf '%s' "$stage_output" | grep -qiE 'already[ -]?staged|already exists|EPUBLISHCONFLICT'; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "$local_version is already staged and awaiting approval."
              echo "(https://www.npmjs.com/settings/~/staged-packages)"
              exit 0
            fi
            exit 1
          fi

          printf '%s\n' "$stage_output"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Staged $local_version. A maintainer must approve it with 2FA"
          echo "(https://www.npmjs.com/settings/~/staged-packages) before it is live."

      - name: Send Matrix message
        if: steps.publish.outputs.released == 'true'
        run: |
          curl -XPOST -d '{"msgtype":"m.text", "body":"A new version of @sasjs/adapter has been STAGED on npm and needs a 2FA approval before it is live. Approve it at https://www.npmjs.com/settings/~/staged-packages \n Please deploy and run dctests with the new adapter to make sure everything is still in place."}' https://matrix.4gl.io/_matrix/client/r0/rooms/!jRebyiGmHZlpfDwYXN:4gl.io/send/m.room.message?access_token=${{ secrets.MATRIX_TOKEN }}
