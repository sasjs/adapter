# Release and stage @sasjs/adapter from one job.
#
# @sasjs/release decides the version from the conventional commits since the last
# tag, creates the tag and the release, and stamps the version npm will read. The
# publish stays in this file because npm's trusted publisher is registered against
# its filename, and because the package is STAGED rather than published: it
# declares dual-use content, so a maintainer approves each version with 2FA.

name: SASjs Build and Publish

on:
  push:
    branches:
      - master
  # A release should not depend on the push trigger firing, and a run that
  # strands a release should be recoverable without a new commit. This makes
  # the release reachable from the Actions UI or the API. Same reason as
  # sasjs/utils publish.yml, which gained it after the merge of #277 produced
  # no workflow run at all.
  workflow_dispatch:

# One release at a time. The push trigger fires on every merge to master and the
# dispatch trigger exists so a stranded release can be finished by hand; with no
# gate the two can overlap, and two runs racing the same tag and the same npm
# stage is a way to strand a release. `cancel-in-progress: false` queues the
# second run rather than cancelling the first, because cancelling a run midway
# through a release is itself a way to leave a tag created and the stage missing.
concurrency:
  group: npmpublish
  cancel-in-progress: false

# read-only by default; the release job asks for the writes it needs, and a job block replaces this one rather than adding to it
permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # the tag, the release, and the assets attached to it
      id-token: write       # npm provenance (trusted publisher) and the attestation
      attestations: write   # actions/attest-build-provenance records it

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the version is worked out from the tags, so a shallow clone has nothing
          # to classify. Publishing is from master or not at all, so the checkout
          # says so rather than inheriting a dispatcher's ref.
          ref: master
          fetch-depth: 0
          # the tag and the release are created over the API, so this token does
          # not need to stay in the git config - and nothing is pushed
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: https://registry.npmjs.org

      # Node 22 ships npm 10.x - OIDC trusted publishing needs npm >= 11.5.1.
      # Pinned to the version the publish path was reviewed with rather than
      # @latest, which would adopt a new npm major into the release path without
      # a commit here.
      # The script fetches that release's tarball and verifies a recorded
      # sha512, rather than installing it: `npm install -g` re-resolves the
      # version against the registry on every run and cannot be attested to, so
      # it is unpinnable by construction.
      # Keep this at the same version as the step in build-unit-tests.yml - that
      # pairing is what makes a pull request read the pack report with the npm
      # the release job uses. Bump the version in .github/scripts/pinned-npm.sh
      # and both jobs follow.
      - name: Pin the npm the release path uses
        run: bash .github/scripts/pinned-npm.sh

        # Restore npm cache manually
      - name: Restore npm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: npm-cache
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Check npm audit
        # Bootstrap the lock-pinned gate before npm ci can run lifecycle scripts.
        # The same full and production info-level policy applies in the PR job.
        run: node scripts/audit-check.mjs

      - name: Install Dependencies
        run: npm ci

      - name: Check code style
        run: npm run lint

      - name: Build Project
        run: npm run build

      - name: Clean up ready for publishing
        run: npm run publishInit

      - name: Check the browser bundle
        # What ships, so it runs after publishInit put dist/ at the package root.
        # The bundle must stay free of the Node polyfill tree - webpack aliasing
        # `crypto` and `constants` to crypto-browserify pulled ~555 KB of
        # AES/RSA/ECDSA polyfills and the vm shim's dynamic code execution into
        # it - and browser-reachable source must not import the utils barrel,
        # which is the other way the crypto chain reaches the bundle
        # (sasjs/utils#275).
        run: node scripts/bundle-check.mjs

      - name: Check what the package would carry
        # After the install, not before. The leak this guards against is the
        # toolchain's own node_modules being matched by a broad allowlist glob
        # ("**/*.d.ts"), so the check has to see that tree - run before the
        # install it packed 3 files and passed while the leak was present.
        run: node scripts/pack-check.mjs

      - name: Check the packed package loads
        # The other direction of the same allowlist: it names the root modules one
        # by one, so a module added to src/ and required by another is silently
        # left out. 6.0.0 shipped auth/refreshTokensForSasjs.js requiring
        # ../apiBasePath, which the allowlist did not name - every Node consumer
        # failed at require, while the suite (which loads src/) was green. This
        # packs, unpacks and requires the entry point, which is the only check
        # that sees what a consumer gets.
        run: node scripts/pack-load-check.mjs

      - name: Check @sasjs dependencies are ranges
        # The PR workflow gates this too, but this is the path that publishes: a
        # change that reaches the release branch without a PR would otherwise
        # ship a pin that nests a second copy in every consumer.
        run: node scripts/dep-range-check.mjs

      - name: Tag and release, if there is anything to release
        id: release
        # The release, and the tag with it, are created over the API by this
        # token: no App with a branch-protection bypass, and nothing pushed to
        # master. `released` is false when the commits since the last tag are
        # docs/build/chore, and true when a release was cut - or when the tag
        # already existed, which is what makes a failed run re-runnable.
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release -- --host github --release --output "$GITHUB_OUTPUT"

      - name: Decide what to stage
        id: prepare
        # stamps the tag's version where npm and the pack steps will read it,
        # refuses a tag that is not on master, and asks the registry whether the
        # version is already there. `publish` is the gate the stage step uses.
        run: npm run release -- --prepare-publish --branch master --output "$GITHUB_OUTPUT"

      # `npm stage publish`, not `npm publish`: the package declares dual-use
      # content (`contentPolicy` in package.json, DISCLOSURE at the root of the
      # tarball). npm's dual-use policy does not permit direct publishing through
      # trusted publishing - staging with a maintainer's 2FA promotion is the
      # permitted automated path. The staged version is not installable until it
      # is approved, so `--prepare-publish` compares against the live registry.
      #
      # `npm stage publish` is always an allowed action for a trusted publisher,
      # independent of `npm publish` and `npm dist-tag`. This package's trust
      # relationship already stages: 5.0.2 was staged through this same OIDC path
      # on 2026-10-14. A trust entry predating the allowed-actions setting would
      # need stage publish enabled in the package's Trusted Publisher settings
      # before this step can authenticate.
      - name: Stage the release on npm
        id: publish
        if: steps.prepare.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail

          # A staged version shares the semver index with published versions but
          # is invisible to `npm view`, so a re-run while an approval is pending
          # (a later step failing after a successful stage, say) passes the guard
          # and meets an already-staged error. That is the state this step wants,
          # so report it as staged rather than failing the build.
          if ! stage_output=$(npm stage publish 2>&1); then
            printf '%s\n' "$stage_output"
            if printf '%s' "$stage_output" | grep -qiE 'already[ -]?staged|already exists|EPUBLISHCONFLICT'; then
              echo "released=true" >> "$GITHUB_OUTPUT"
              echo "$VERSION is already staged and awaiting approval."
              echo "(https://www.npmjs.com/settings/~/staged-packages)"
              exit 0
            fi
            exit 1
          fi

          printf '%s\n' "$stage_output"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "Staged $VERSION. A maintainer must approve it with 2FA"
          echo "(https://www.npmjs.com/settings/~/staged-packages) before it is live."

      - name: Pack the tarball this run stages
        id: pack
        if: steps.publish.outputs.released == 'true'
        # The same tree npm packed for the stage, because nothing has changed
        # since. This is the file the attestation is about, and packing it here
        # rather than fetching it from the registry is what makes the attestation
        # possible at all: a staged version is not downloadable until a maintainer
        # approves it, which is why the workflow this replaces produced no assets
        # for v5.2.3, v5.2.4 or v5.2.5.
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          ls -l dist

      - name: Attest the tarball's build provenance
        id: attest
        if: steps.publish.outputs.released == 'true'
        uses: sasjs/release/.github/actions/attest-assets@6bce05cbcd9364c7097f089ea6c9132978a500ca # v0.19.0
        with:
          subject-path: 'dist/*.tgz'
          version: ${{ steps.prepare.outputs.version }}

      - name: Attach the tarball and its provenance to the release
        if: steps.publish.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        # The shared action names the bundle for the scorecard's Signed-Releases check.
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.tgz "$BUNDLE" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'

      - name: Send Matrix message
        if: steps.publish.outputs.released == 'true'
        run: |
          curl -XPOST -d '{"msgtype":"m.text", "body":"A new version of @sasjs/adapter has been STAGED on npm and needs a 2FA approval before it is live. Approve it at https://www.npmjs.com/settings/~/staged-packages \n Please deploy and run dctests with the new adapter to make sure everything is still in place."}' https://matrix.4gl.io/_matrix/client/r0/rooms/!jRebyiGmHZlpfDwYXN:4gl.io/send/m.room.message?access_token=${{ secrets.MATRIX_TOKEN }}
