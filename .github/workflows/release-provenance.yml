# Attach the published tarball - and its build provenance - to the GitHub release.
#
# adapter's releases carried no assets, and scorecard skips a release with no assets,
# so Signed-Releases read as inconclusive rather than as a failure. That is the good
# state to be in: attaching the artifact *without* an attestation would turn it into a
# zero, because the check looks for an asset whose name ends `.intoto.jsonl` and scores
# the release 0 when there is none. So the artifact and its attestation are attached
# together, and the subject is the version the registry serves rather than a local
# build, so what is attested is what a consumer installs.
name: Release provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the artifact and its attestation to
        required: true
        type: string

permissions: read-all

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach the artifact and the bundle to the release
      id-token: write # sign the attestation
      attestations: write # record it against this repository
    steps:
      - name: Resolve the tag and the version it names
        id: version
        env:
          RELEASED_TAG: ${{ github.event.release.tag_name }}
          CHOSEN_TAG: ${{ inputs.tag }}
        run: |
          tag="${CHOSEN_TAG:-$RELEASED_TAG}"
          if [ -z "$tag" ]; then
            echo "::error::no tag - run this from a published release or pass one"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the tarball the registry serves
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # `release: published` fires seconds before the registry serves the
          # version, and `npm pack` against a version that is not there yet is a
          # 404. The first version of this step retried ten times inside a minute,
          # which is shorter than the registry's own lag: v5.2.3, v5.2.4 and
          # v5.2.5 each ended with no assets at all, and the loop hid the reason
          # by printing only the last line of npm's error - the line that says
          # where the log is, not what went wrong.
          #
          # So: wait for availability first, with a deadline measured in minutes
          # and npm's own first error line in the output, then pack exactly once.
          deadline=$(( SECONDS + 600 ))
          until npm view "@sasjs/adapter@${VERSION}" dist.integrity \
              > "$RUNNER_TEMP/view.out" 2> "$RUNNER_TEMP/view.err"; do
            # npm puts the code on one line and the reason on the next, so prefer
            # the line that carries a message
            reason="$(grep -m1 -E 'npm (error|ERR) [0-9]{3} .+' "$RUNNER_TEMP/view.err" \
              || grep -m1 -E 'npm (error|ERR)' "$RUNNER_TEMP/view.err" \
              || echo 'no reason given')"

            # Only "not published yet" is worth waiting for. A bad credential, a
            # DNS failure or a rate limit would otherwise spend the whole deadline
            # and then report as though the version were missing.
            if ! grep -qE 'npm (error|ERR) (code )?(E404|ETARGET)\b' "$RUNNER_TEMP/view.err"; then
              echo "::error::npm view failed for a reason other than the version being absent"
              sed -n '1,6p' "$RUNNER_TEMP/view.err"
              exit 1
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::@sasjs/adapter@${VERSION} is still not in the registry after 10 minutes"
              sed -n '1,6p' "$RUNNER_TEMP/view.err"
              exit 1
            fi

            echo "not in the registry yet, ${SECONDS}s in: ${reason}"
            sleep 15
          done

          expected="$(cat "$RUNNER_TEMP/view.out")"

          # `npm view` exits 0 and prints nothing when the field resolves but is
          # absent, which a mirror or a proxy can do. Without this the run falls
          # through to an integrity mismatch against an empty value - the same
          # shape of misleading failure this step exists to remove.
          if [ -z "$expected" ]; then
            echo "::error::the registry returned no dist.integrity for @sasjs/adapter@${VERSION}"
            exit 1
          fi

          if ! npm pack "@sasjs/adapter@${VERSION}" --pack-destination "$RUNNER_TEMP" --json \
              > "$RUNNER_TEMP/pack.json" 2> "$RUNNER_TEMP/pack.err"; then
            echo "::error::npm pack failed even though ${VERSION} is in the registry"
            sed -n '1,10p' "$RUNNER_TEMP/pack.err"
            exit 1
          fi

          # npm 12 reports the pack as an object keyed by package name; npm 11 and
          # below report an array. This job runs on node 22's bundled npm today,
          # but reading only one shape is how #933 broke a release.
          packed="$(node -e "
            const report = require(process.argv[1])
            const entry = Array.isArray(report) ? report[0] : report[Object.keys(report)[0]]
            process.stdout.write(entry.filename)
          " "$RUNNER_TEMP/pack.json")" || {
            echo "::error::could not read the packed filename from the pack report"
            sed -n '1,20p' "$RUNNER_TEMP/pack.json"
            exit 1
          }

          if [ -z "$packed" ] || [ ! -f "$RUNNER_TEMP/$packed" ]; then
            echo "::error::npm pack named ${packed:-nothing} but there is no such file"
            exit 1
          fi

          # the tarball we attest must be the one the registry vouches for, not merely
          # one this workflow downloaded
          actual="sha512-$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$packed" | openssl base64 -A)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::the packed tarball does not match the integrity the registry publishes"
            echo "   expected: $expected"
            echo "   actual:   $actual"
            exit 1
          fi

          asset="${TAG}-${packed}"
          mv "$RUNNER_TEMP/$packed" "$RUNNER_TEMP/$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$asset" >> "$GITHUB_OUTPUT"
          echo "integrity=$actual" >> "$GITHUB_OUTPUT"

      - name: Say what the attestation covers
        # the subject is the registry tarball fetched at release time, so the claim is
        # "this artifact, as the registry serves it, was fetched and renamed by this
        # workflow at <sha>" - not "this artifact was built from the tagged source".
        # Rebuilding from the tag cannot be compared byte for byte (npm tarballs carry
        # timestamps), so the integrity check above is what ties the file to the
        # registry, and this note is what ties the claim to its scope.
        env:
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.pack.outputs.asset }}
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          {
            echo "### Provenance for ${TAG}"
            echo
            echo "Subject: \`${ASSET}\` - the tarball the npm registry serves for ${TAG},"
            echo "verified against the registry's published integrity:"
            echo
            echo '```'
            echo "${INTEGRITY}"
            echo '```'
            echo
            echo "The attestation covers what was fetched here, at this commit; it does not"
            echo "claim the registry tarball was rebuilt from the tagged source."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the tarball
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.path }}

      - name: Attach the artifact and its attestation together
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.pack.outputs.asset }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          # scorecard looks for an asset name ending .intoto.jsonl; the action writes a
          # bundle, so it is uploaded under that name
          cp "$BUNDLE" "$RUNNER_TEMP/${ASSET}.intoto.jsonl"
          gh release upload "$TAG" \
            "$RUNNER_TEMP/$ASSET" \
            "$RUNNER_TEMP/${ASSET}.intoto.jsonl" \
            --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
