name: Coverage baseline

# Publishes the coverage a pull request is measured against: it runs on every push
# to master, so the baseline is the tree the next pull request is diffed
# against, and on demand, so it can be refreshed after a failed run.
#
# The pipeline is sasjs/release's reusable workflow - the checkout, the node setup,
# the artifact name and its 90-day retention live there once, instead of in a copy
# per repository. This file states the build and keeps the concurrency, which a
# called workflow cannot be given.
#
# The comparison is `sasjs-release --coverage-ratchet`, run by
# .github/workflows/build-unit-tests.yml against this artifact.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately not cancel-in-progress: a baseline is per commit, and a pull
  # request based on that commit needs it after a newer commit on master has
  # landed. Cancelling the older run would leave that commit with no baseline at
  # all, which is worse than running two suites a few minutes apart.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    # v0.18.0: the merge commit, since a tag is not a pin and the action-pins check
    # demands one for every external `uses:`
    uses: sasjs/release/.github/workflows/coverage-baseline.yml@6bce05cbcd9364c7097f089ea6c9132978a500ca # v0.19.0
    with:
      # required: the toolchain the head summary is measured with has to match
      runs-on: ubuntu-22.04
      node-version: 22
      # the verified npm tarball, before anything installs
      pre-install-command: bash .github/scripts/pinned-npm.sh
      test-command: npx jest --silent --runInBand --ci --coverage
      timeout-minutes: 30
