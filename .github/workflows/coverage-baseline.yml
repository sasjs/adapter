name: Coverage baseline

# Publishes the coverage a pull request is measured against. It runs on every
# push to master, so the baseline is the tree the next pull request is diffed
# against, and on demand, so it can be refreshed after a failed run.
#
# The pull request workflow (.github/workflows/build-unit-tests.yml, steps
# "Find the coverage baseline" through "Fail on a coverage regression")
# downloads this artifact and fails a pull request that lowers any metric.
# The same mechanism runs in sasjs/cli and sasjs/vscode-extension.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deliberately not cancel-in-progress: a baseline is per commit, and a pull
  # request based on that commit needs it after a newer commit on master has
  # landed. Cancelling the older run would leave that commit with no baseline at
  # all, which is worse than running two suites a few minutes apart.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Pin the npm the release path uses
        run: bash .github/scripts/pinned-npm.sh

      - name: Install Dependencies
        run: npm ci

      - name: Generate the coverage summary
        # plain jest, not the report action: there is no pull request to comment
        # on here, and an action's failure would skip the upload. The
        # json-summary reporter in jest.config.js is what writes the file.
        run: npx jest --silent --runInBand --ci --coverage

      - name: Publish the coverage baseline
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 90
