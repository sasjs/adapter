version: 2
updates:

  # The workflows pin their actions to a commit SHA - that is what the scorecard's
  # Pinned-Dependencies check rewards, and it makes a compromised tag useless - so
  # something has to move those pins, or they rot.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # one PR a week carrying every bump, rather than the limit deciding which
    # actions stay current
    groups:
      actions:
        patterns:
          - '*'
